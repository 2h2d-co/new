[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "2.2.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
node = "22.23.3"
npm = "11.20.0"
actionlint = "1.7.12"
zizmor = "1.30.1"

[shell_alias]
"new:local" = "node {{config_root}}/src/cli.ts"

[tasks.check]
description = "Run all non-writing project checks"
run = ["hk check --all --check", "npm test", "npm audit", "npm run pack:dry"]

[tasks.init]
description = "Install locked dependencies and Git hooks"
run = ["npm ci --ignore-scripts", "hk install --mise"]
